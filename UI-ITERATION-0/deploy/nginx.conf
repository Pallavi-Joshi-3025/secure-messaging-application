# Minimal nginx server for the static secure-messaging app.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Ensure ES modules are served with the correct JavaScript MIME type.
    types {
        text/html                             html;
        text/css                              css;
        application/javascript                js mjs;
        image/svg+xml                         svg;
        application/json                      json;
        application/octet-stream              map;
    }
    default_type application/octet-stream;

    # Lightweight health endpoint for Kubernetes probes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
